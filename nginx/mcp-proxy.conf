# Reverse proxy for the searxng-mcp-server Streamable HTTP endpoint.
# Plain HTTP on purpose — TLS belongs to whatever fronts 127.0.0.1:8443.

server {
    listen 8443;

    # The server only serves /mcp; answer anything else here instead of
    # forwarding a request that will 404 anyway.
    location = /mcp {
        proxy_pass http://mcp:3000;
        proxy_http_version 1.1;
        # Must stay within the server's SEARXNG_ALLOWED_HOSTS (see compose file).
        proxy_set_header Host mcp;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE-capable streaming: no buffering, long-lived reads.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location / {
        return 404;
    }
}
