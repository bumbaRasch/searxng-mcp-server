# Loopback-only instance (compose binds 127.0.0.1, limiter off). If ever exposed
# publicly: enable the limiter + add valkey — https://docs.searxng.org
use_default_settings: true
server:
  limiter: false
general:
  instance_name: 'searxng-mcp-server'
search:
  formats:
    - html
    - json

# OpenAlex killed its mailto polite pool in Feb 2026: without an API key the
# engine gets ~100 credits/day per IP, which starves paper_search on shared
# or CI IPs. Disabled by default until the SearXNG engine supports api_key
# (https://github.com/searxng/searxng/issues/6513); if you have a key, flip
# disabled back to false once api_key support lands upstream.
engines:
  - name: openalex
    disabled: true
