# Loopback-only instance (compose binds 127.0.0.1, limiter off). If ever exposed
# publicly: enable the limiter + add valkey — https://docs.searxng.org
use_default_settings: true
server:
  limiter: false
general:
  instance_name: 'searxng-mcp-server'
search:
  formats:
    - html
    - json

# Engine API keys live HERE, not in the MCP server. OpenAlex has required a key
# since Feb 2026 (mailto pool removed): https://github.com/searxng/searxng/issues/6513
# engines:
#   - name: openalex
#     api_key: 'replace-with-your-openalex-api-key'
