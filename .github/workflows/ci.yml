name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22.19.0', 24, 26]
    steps:
      # Actions are pinned to commit SHAs (tags are movable).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run lint:types
      - run: pnpm run format:check
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm test:coverage
      - run: pnpm run build
      - run: pnpm pack
      - run: tar -tzf searxng-mcp-server-*.tgz | grep -E 'dist/index\.js'
      - run: tar -tzf searxng-mcp-server-*.tgz | grep -E '(README\.md|LICENSE)'
      # The MCP Registry limits server.json description to 100 chars, and that
      # used to surface only at publish time. mcp-publisher validate POSTs the
      # file to the registry's /v0/validate endpoint (exhaustive JSON/schema/
      # semantic validation; no login needed, but needs network access) and its
      # non-zero exit fails the job. The version pin is the release tag in the
      # URL: this is a run: step, so Renovate's pinGitHubActionDigests does not
      # manage it — raise the pin by hand when the registry ships a newer
      # mcp-publisher (an old binary fails against the registry with
      # "invalid audience").
      - name: Validate server.json against the MCP Registry
        run: |
          curl -fsSL -o mcp-publisher.tar.gz "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz"
          echo 'a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  mcp-publisher.tar.gz' | sha256sum --check -
          tar xzf mcp-publisher.tar.gz mcp-publisher
          ./mcp-publisher validate server.json
  # Decision on e2e gating (final): e2e deliberately stays out of the PR
  # gate. It boots a live docker-compose SearXNG and talks to it over the
  # real network — a standing source of false reds on PRs. The mandatory
  # signal is the nightly schedule run (plus manual workflow_dispatch);
  # retries against flakes are a separate future stage, not a reason to gate
  # PRs on e2e.
  e2e:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs (tags are movable).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # docker-compose.yml requires SEARXNG_SECRET from a .env file.
      - run: printf 'SEARXNG_SECRET=%s\n' "$(openssl rand -hex 32)" > .env
      - run: docker compose up -d
      - name: Wait for the SearXNG JSON API
        run: |
          for i in $(seq 1 30); do
            if curl -fsS 'http://127.0.0.1:8888/search?q=test&format=json' >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          echo 'SearXNG did not become ready in 60s' >&2
          exit 1
      - run: node scripts/e2e.mjs
        env:
          SEARXNG_URL: http://127.0.0.1:8888
      - run: node scripts/e2e-http.mjs
        env:
          SEARXNG_URL: http://127.0.0.1:8888
