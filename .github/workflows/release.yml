name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Build before publish so npm's bin validation finds dist/index.js
      # (prepublishOnly re-runs the gate, but only after that validation).
      - run: pnpm build
      # Skip when the version exists so a failed run can be re-run.
      - name: Publish to npm
        run: |
          PKG=$(node -p "require('./package.json').name")
          VERSION="${GITHUB_REF_NAME#v}"
          if npm view "$PKG@$VERSION" version >/dev/null 2>&1; then
            echo "$PKG@$VERSION already published, skipping"
          else
            npm publish --provenance
          fi
      # npm can take minutes to expose a new version; the registry rejects
      # the publish below with 400 "version not found" until it resolves.
      - name: Wait for npm to expose the version
        run: |
          PKG=$(node -p "require('./package.json').name")
          VERSION="${GITHUB_REF_NAME#v}"
          for _ in $(seq 40); do
            if npm view "$PKG@$VERSION" version >/dev/null 2>&1; then
              exit 0
            fi
            sleep 15
          done
          echo "::error::$PKG@$VERSION not visible on npm after 10 minutes"
          exit 1
      # MCP Registry publish, after npm publish (the registry
      # hosts metadata only and requires the npm package to exist first).
      # GitHub OIDC: no dedicated secret — id-token: write above lets GitHub
      # mint a fresh short-lived JWT per job run, replacing the manual
      # mcp-publisher login whose JWT expired between releases. The install
      # intentionally uses releases/latest: an outdated binary fails against
      # the registry with "invalid audience".
      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
      - name: Log in to the MCP Registry via GitHub OIDC
        run: ./mcp-publisher login github-oidc
      # The only step that can't be repeated: re-publishing an existing version fails.
      - name: Publish to the MCP Registry
        run: ./mcp-publisher publish
      - name: Create GitHub release
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists, skipping"
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
          fi
        env:
          GH_TOKEN: ${{ github.token }}
